[server]
headless = true
runOnSave = true
maxUploadSize = 5
enableStaticServing = false

[theme]
primaryColor = "#6C63FF"
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#1A1A2E"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "auto"

[browser]
gatherUsageStats = false
