[server]
headless = true
runOnSave = true
maxUploadSize = 5
enableStaticServing = false

[theme]
base = "dark"
primaryColor = "#FF4A4A"
backgroundColor = "#110D14"
secondaryBackgroundColor = "#1E1823"
textColor = "#F4ECE2"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "auto"

[browser]
gatherUsageStats = false
